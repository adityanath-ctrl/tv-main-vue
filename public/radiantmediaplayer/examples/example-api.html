<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  <title>Radiant Media Player - API usage example</title>
</head>

<body>
  <!-- Radiant Media Player core library optimised for HLS streaming -->
  <script src="../dist/rmp-hlsjs.min.js"></script>
  <!-- Player container -->
  <div id="rmp">
  </div>
  <script>
    // Player settings
    const src = {
      hls: 'https://your-hls-url.m3u8'
    };
    const settings = {
      // Enter your license key
      licenseKey: 'your-license-key',
      src: src,
      width: 640,
      height: 360,
      pathToRmpFiles: '../',
      contentMetadata: {
        poster: [
          'https://your-poster-url.jpg'
        ]
      }
    };

    let timeupdateCount = 0;
    const elementID = 'rmp';
    const rmp = new RadiantMP(elementID);
    
    // we wire events before calling init
    rmp.on('timeupdate', async () => {
      console.log('timeupdate');
      timeupdateCount++;
      if (timeupdateCount === 10) {
        // seek to 10 seconds
        try {
          await rmp.seekTo(10000);
        } catch (error) {
          console.log(error);
        }

      }
    });

    rmp.on('ended', () => {
      console.log('ended');
    });

    // Init player function
    async function initPlayer() {
      try {
        await rmp.init(settings);
      } catch (error) {
        console.error(error);
      }
    }

    initPlayer();
    
  </script>
</body>

</html>
