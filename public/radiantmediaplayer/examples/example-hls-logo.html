<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">
  <title>Radiant Media Player - HLS Example with Logo</title>
</head>

<body>
  <!-- Radiant Media Player core library - optimized for HLS streaming -->
  <script src="../dist/rmp-hlsjs.min.js"></script>
  <!-- Player container -->
  <div id="rmp"></div>
  <script>
    // Player settings
    const src = {
      hls: 'https://your-hls-url.m3u8'
    };
    const settings = {
      // Enter your license key
      licenseKey: 'your-license-key',
      src: src,
      width: 640,
      height: 360,
      logo: {
        imgUri: 'https://www.radiantmediaplayer.com/images/radiantmediaplayer-logo-300.png',
        clickUri: 'https://www.radiantmediaplayer.com',
        position: 'topleft',
        margin: '8px',
        watermark: false,
        pauseContentOnLogoClick: true
      },
      pathToRmpFiles: '../',
      contentMetadata: {
        poster: [
          'https://your-poster-url.jpg'
        ]
      }
    };

    // Init player function
    async function initPlayer() {
      try {
        await rmp.init(settings);
      } catch (error) {
        console.error(error);
      }
    }
    const elementID = 'rmp';
    const rmp = new RadiantMP(elementID);
    initPlayer();
  </script>
</body>

</html>
